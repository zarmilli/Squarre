
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruitment | Squarredesk</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <main class="admin-container">
    <section id="loginSection">
      <h1>Recruitment Portal</h1>
      <p>Sign in to manage candidate applications.</p>

      <form id="loginForm">
        <input id="adminEmail" type="email" placeholder="Email address" required>
        <input id="adminPassword" type="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>

      <p id="loginMessage" role="status"></p>
    </section>

    <section id="dashboardSection" hidden>
      <header>
        <h1>Candidate Applications</h1>
        <button id="logoutButton">Sign out</button>
      </header>

      <div class="dashboard-stats">
        <p>Total: <strong id="totalCount">0</strong></p>
        <p>New: <strong id="newCount">0</strong></p>
        <p>Shortlisted: <strong id="shortlistedCount">0</strong></p>
      </div>

      <input id="searchInput" type="search" placeholder="Search candidates...">

      <div id="applicationsList"></div>
      <p id="dashboardMessage" role="status"></p>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
