
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers | Squarredesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="application-container">
    <h1>Join Squarredesk</h1>
    <p>Tell us a little about yourself and submit your application.</p>

    <form id="applicationForm">
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" required maxlength="120">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required maxlength="254">

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" required maxlength="30">

      <label for="position">Position applying for</label>
      <select id="position" name="position" required>
        <option value="">Select a position</option>
        <option value="Junior Ads Specialist">Junior Ads Specialist</option>
        <option value="Marketing Assistant">Marketing Assistant</option>
        <option value="Software Developer">Software Developer</option>
      </select>

      <label for="cover_letter">Why would you like to join us?</label>
      <textarea id="cover_letter" name="cover_letter" maxlength="5000"></textarea>

      <label for="cv">Upload your CV (PDF, maximum 5MB)</label>
      <input id="cv" name="cv" type="file" accept=".pdf,application/pdf" required>

      <!-- Honeypot: hidden from genuine applicants -->
      <div aria-hidden="true" style="position:absolute;left:-9999px;">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <label>
        <input type="checkbox" id="privacyConsent" required>
        I consent to Squarredesk processing my personal information
        for recruitment purposes in accordance with its privacy notice.
      </label>

      <button type="submit" id="submitButton">Submit application</button>

      <p id="formMessage" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script type="module" src="js/applications.js"></script>
</body>
</html>
